name: CI CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
   runs-on: ubuntu-latest

   steps:
    - name: Checkout code
      uses: actions/Checkout@v2

    - name: Docker Login
      uses: docker/login-action@v2
      with: 
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}

    - name: Build and Push
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile.backend
        push: true
        tags: lakhwinder97187/new:${{github.sha}}

    - name: Deploy TO VM
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY}}" > ~/ssh_key
        chmod 600 ~/ssh_key
        ssh -o StrictHostKeyChecking=no -i ~/ssh_key azureuser@20.189.114.185 "
           docker stop backend || true
           docker rm backend || true
           docker run --name backend -d -p 3000:3000 lakhwinder97187/new:${{ github.sha }}
        "
        rm -f ~/ssh_key























